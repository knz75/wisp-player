<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wisp</title>
<script>
// Звонок теперь внутри плеера. Старые ссылки вида /call?r=КОМНАТА ведут туда же.
const r = (new URLSearchParams(location.search).get('r') || '').replace(/[^a-z0-9_-]/gi, '').slice(0, 64);
location.replace(r ? '/?call=' + r : '/');
</script></head><body style="background:#000"></body></html>
