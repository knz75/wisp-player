<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wisp Call</title>
<style>
:root{--bg:#1e2431;--panel:#283044;--deep:#1a1f2b;--text:#e7e9ef;--dim:#9aa3b5;--acc:#9fb1ff;--on:#ffb86b;--bad:#ff8b8b;--ok:#8fe3b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 6px}
h2{font-size:17px;margin:0 0 10px}
p{margin:0 0 10px}
a{color:var(--acc)}
.dim{color:var(--dim)}
.small{font-size:14px}
section{background:var(--panel);border-radius:12px;padding:14px;margin:12px 0}
button{width:100%;min-height:50px;border:0;border-radius:10px;background:var(--acc);color:#141826;font:600 16px system-ui,sans-serif;cursor:pointer}
button+button{margin-top:8px}
button.alt{background:var(--deep);color:var(--text)}
button.on{background:var(--on)}
button.end{background:var(--bad)}
button:disabled{opacity:.6}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.row>button+button{margin-top:0}
select{display:block;width:100%;margin-top:6px;min-height:44px;border-radius:8px;border:0;background:var(--deep);color:var(--text);padding:0 8px;font-size:15px}
#status{font-weight:600}
.link{background:var(--deep);border-radius:8px;padding:10px;margin:0 0 10px;font-size:14px;word-break:break-all;color:var(--dim)}
.peer{background:var(--deep);border-radius:10px;padding:10px;margin-top:8px}
.peer .top{display:flex;justify-content:space-between;gap:8px}
.st-ok{color:var(--ok)}
.st-bad{color:var(--bad)}
.chk{display:flex;align-items:flex-start;gap:10px;margin-top:10px;font-size:14px;color:var(--dim)}
.chk input{width:20px;height:20px;flex:none;margin:0}
.meter{height:8px;background:var(--deep);border-radius:4px;overflow:hidden;margin-top:10px}
#lvl{height:100%;width:0;background:var(--on)}
canvas.radar{display:block;width:100%;max-width:260px;aspect-ratio:1;margin:0 auto 6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.foot{margin-top:18px;font-size:14px}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>

<div id="start">
  <p class="dim" id="intro"></p>
  <button id="bStart"></button>
  <button id="bDemo" class="alt"></button>
  <p id="startMsg" class="small dim" style="margin-top:10px"></p>
  <p class="foot"><a href="/" id="playerLink"></a></p>
</div>

<div id="demo" class="hidden">
  <section>
    <p class="small dim" id="demoText"></p>
    <canvas id="radarDemo" class="radar"></canvas>
    <div class="peer"><div class="top"><span><span class="dot" style="background:#ffb86b"></span><span id="demoName"></span></span></div>
      <select id="demoZone"></select></div>
    <p id="demoMsg" class="small dim" style="margin-top:10px"></p>
  </section>
  <p class="small dim" id="demoTry"></p>
  <button id="bDemoCall"></button>
  <button id="bDemoStop" class="alt"></button>
</div>

<div id="call" class="hidden">
  <section>
    <p id="status"></p>
    <div class="link" id="link"></div>
    <button id="bShare" class="alt"></button>
  </section>

  <section>
    <h2 id="hPeople"></h2>
    <canvas id="radar" class="radar"></canvas>
    <div id="peers"></div>
  </section>

  <section>
    <h2 id="hMic"></h2>
    <select id="dev"></select>
    <label class="chk"><input type="checkbox" id="proc"> <span id="procLabel"></span></label>
    <div class="meter"><div id="lvl"></div></div>
    <button id="bFile" class="alt" style="margin-top:12px"></button>
    <input type="file" id="file" accept="audio/*" class="hidden">
    <div class="row" style="margin-top:8px">
      <button id="bMute" class="alt"></button>
      <button id="bEnd" class="end"></button>
    </div>
  </section>
</div>
</main>

<script>
const $ = id => document.getElementById(id);

// ---------- язык: русский для ru/uk/be браузеров, иначе английский ----------
const RU = /^(ru|uk|be)\b/i.test(navigator.language || '');
const T = RU ? {
  title:'Wisp - звонок',
  intro:'Голос собеседника звучит с выбранного места - рядом справа, чуть впереди, сзади. Наденьте наушники, телефон можно убрать в карман.',
  start:'Начать звонок', join:'Войти в звонок', demo:'Послушать пример',
  player:'Плеер Wisp - музыка и книги в пространстве',
  noMic:'Браузер не даёт доступ к микрофону.',
  micFail:'Микрофон не включился: {e}. Разрешите доступ и попробуйте снова.',
  connecting:'Подключаемся...', share:'Поделиться ссылкой', copied:'Ссылка скопирована', copyAbove:'Скопируйте ссылку выше',
  shareText:'Пространственный звонок в Wisp, наденьте наушники:',
  people:'Собеседники', nobody:'Пока никого. Отправьте ссылку собеседнику.', mic:'Микрофон',
  ec:'Эхоподавление - для колонок; с наушниками на телефоне выключите',
  file:'Запись вместо микрофона', backMic:'Вернуть микрофон', mute:'Выключить звук', unmute:'Включить звук', end:'Завершить',
  waiting:'Ждём собеседника', joining:'Кто-то подключается...', ok:'На связи: {n}', linking:'Соединяемся...',
  failed:'Не удалось соединиться - попробуйте другую сеть', lost:'Связь с сервером потеряна - обновите страницу',
  full:'В этом звонке уже 4 человека', badLink:'Неверная ссылка на звонок', err:'Ошибка соединения: ',
  fileFail:'Не удалось открыть файл: ', micSwitch:'Микрофон не переключился: ',
  ended:'Звонок завершён.', newCall:'Новый звонок', person:'Собеседник {n}',
  direct:'напрямую', relay:'через сервер',
  st:{new:'соединяемся', connecting:'соединяемся', connected:'на связи', disconnected:'связь прервалась', failed:'не удалось соединиться', closed:'отключён'},
  demoText:'Голос гуляет вокруг вас внутри выбранной зоны. Смотрите на радар - он помогает уху найти звук. Наденьте наушники.',
  demoName:'Голос примера', demoTry:'Понравилось? Начните настоящий звонок и отправьте ссылку другу.',
  demoStop:'Остановить пример', demoLoading:'Загружаем запись...', demoMissing:'Запись для примера пока не загружена.',
  zones:['Рядом справа','Рядом слева','Справа впереди','Слева впереди','Сзади','Вдали справа','Вдали слева','Правое плечо, неподвижно','Левое плечо, неподвижно']
} : {
  title:'Wisp Call',
  intro:'Your friend\'s voice comes from a place you choose - walking beside you on the right, a little ahead, behind. Put on headphones, the phone can stay in your pocket.',
  start:'Start a call', join:'Join the call', demo:'Hear a demo',
  player:'Wisp player - music and audiobooks in space',
  noMic:'This browser gives no access to the microphone.',
  micFail:'The microphone did not start: {e}. Allow access and try again.',
  connecting:'Connecting...', share:'Share the link', copied:'Link copied', copyAbove:'Copy the link above',
  shareText:'Spatial call in Wisp - put on headphones:',
  people:'People', nobody:'Nobody here yet. Send the link to a friend.', mic:'Microphone',
  ec:'Echo cancellation - for speakers; turn it off when using headphones on a phone',
  file:'Play a file instead of mic', backMic:'Back to microphone', mute:'Mute', unmute:'Unmute', end:'End call',
  waiting:'Waiting for someone to join', joining:'Someone is joining...', ok:'Connected: {n}', linking:'Connecting...',
  failed:'Could not connect - try another network', lost:'Lost connection to the server - reload the page',
  full:'This call already has 4 people', badLink:'Invalid call link', err:'Connection error: ',
  fileFail:'Could not open the file: ', micSwitch:'The microphone did not switch: ',
  ended:'Call ended.', newCall:'New call', person:'Person {n}',
  direct:'direct', relay:'via server',
  st:{new:'connecting', connecting:'connecting', connected:'connected', disconnected:'connection lost', failed:'could not connect', closed:'left'},
  demoText:'The voice walks around you inside the chosen zone. Watch the radar - it helps your ear find the sound. Put on headphones.',
  demoName:'Demo voice', demoTry:'Like it? Start a real call and send the link to a friend.',
  demoStop:'Stop the demo', demoLoading:'Loading the recording...', demoMissing:'The demo recording is not available yet.',
  zones:['Beside you, right','Beside you, left','Ahead, right','Ahead, left','Behind','Far right','Far left','Right shoulder, still','Left shoulder, still']
};
const tf = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => v[k]);
document.documentElement.lang = RU ? 'ru' : 'en';
document.title = T.title;
for(const [id, key] of [['title','title'],['intro','intro'],['bDemo','demo'],['playerLink','player'],['demoText','demoText'],
  ['demoName','demoName'],['demoTry','demoTry'],['bDemoCall','start'],['bDemoStop','demoStop'],['bShare','share'],
  ['hPeople','people'],['hMic','mic'],['procLabel','ec'],['bFile','file'],['bMute','mute'],['bEnd','end']]) $(id).textContent = T[key];

const ICE = [{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];

// Зоны: az - направление в градусах (0 впереди, 90 справа, 180 сзади, -90 слева),
// spread - на сколько градусов голос гуляет в стороны, d - от и до какого расстояния (м)
const ZONES = [
  {id:'r',  az:90,  spread:35, d:[0.9,1.3]},
  {id:'l',  az:-90, spread:35, d:[0.9,1.3]},
  {id:'rf', az:45,  spread:25, d:[1.0,1.6]},
  {id:'lf', az:-45, spread:25, d:[1.0,1.6]},
  {id:'b',  az:180, spread:40, d:[1.0,1.5]},
  {id:'rx', az:70,  spread:25, d:[2.5,3.5], far:true},
  {id:'lx', az:-70, spread:25, d:[2.5,3.5], far:true},
  {id:'rs', az:95,  spread:0,  d:[0.45,0.45], y:-0.25},
  {id:'ls', az:-95, spread:0,  d:[0.45,0.45], y:-0.25}
];
ZONES.forEach((z, i) => z.name = T.zones[i]);
const ZONE_OPTIONS = ZONES.map(z => '<option value="' + z.id + '">' + z.name + '</option>').join('');
const DEFAULT_ZONES = ['r', 'l', 'rf', 'b'];
const COLORS = ['#ffb86b', '#9fb1ff', '#8fe3b0', '#ff9ad5'];

let ctx, ws, room, myId, pingTimer, raf, moveTimer;
let micStream, micSrc, micHP, micGain, micDest, sendTrack, muted = false;
let fileSrc = null, demo = null, peerNo = 0;
const peers = new Map();

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function setStatus(t){ const el = $('status'); if(el) el.textContent = t; }
function send(m){ if(ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
function newRoom(){
  const a = new Uint8Array(6); crypto.getRandomValues(a);
  return Array.from(a, b => (b % 36).toString(36)).join('') + Date.now().toString(36).slice(-2);
}
async function audio(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    moveTimer = setInterval(moveTick, 50);
  }
  await ctx.resume();
  return ctx;
}

// ---------- пространство ----------
function zoneOf(v){ return ZONES.find(z => z.id === v.place) || ZONES[0]; }
function freePlace(){
  const used = new Set([...peers.values()].map(p => p.place));
  return DEFAULT_ZONES.find(id => !used.has(id)) || DEFAULT_ZONES[0];
}
function freeColor(){
  const used = new Set([...peers.values()].map(p => p.color));
  return COLORS.find(c => !used.has(c)) || COLORS[0];
}
function phases(){ return {ph1:Math.random() * 6.28, ph2:Math.random() * 6.28, ph3:Math.random() * 6.28}; }
// где сейчас голос: медленное неравномерное блуждание внутри зоны
function zonePos(v, t){
  const z = zoneOf(v);
  const w = 0.65 * Math.sin(2 * Math.PI * t / 23 + v.ph1) + 0.35 * Math.sin(2 * Math.PI * t / 37 + v.ph2);
  const s = 0.5 + 0.5 * Math.sin(2 * Math.PI * t / 31 + v.ph3);
  return {az: z.az + z.spread * w, d: z.d[0] + (z.d[1] - z.d[0]) * s, y: z.y || 0, far: !!z.far};
}
function spatialChain(v, src){
  v.src = src;
  v.lp = new BiquadFilterNode(ctx, {type:'lowpass', frequency:20000});
  v.pan = new PannerNode(ctx, {panningModel:'HRTF', distanceModel:'inverse', refDistance:1, rolloffFactor:1});
  src.connect(v.lp).connect(v.pan).connect(ctx.destination);
  applyPos(v, performance.now() / 1000);
}
function applyPos(v, t){
  if(!v.pan) return;
  const q = zonePos(v, t), a = q.az * Math.PI / 180, now = ctx.currentTime;
  v.pan.positionX.setTargetAtTime(q.d * Math.sin(a), now, 0.08);
  v.pan.positionY.setTargetAtTime(q.y, now, 0.08);
  v.pan.positionZ.setTargetAtTime(-q.d * Math.cos(a), now, 0.08);
  // за спиной верха мягче - подсказка мозгу, что звук сзади
  const back = Math.max(0, -Math.cos(a));
  let f = 20000 * Math.pow(7000 / 20000, back);
  if(q.far) f = Math.min(f, 4000);
  v.lp.frequency.setTargetAtTime(f, now, 0.08);
}
function drawRadar(cv, voices, t){
  if(!cv || cv.offsetParent === null) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth; if(!W) return;
  if(cv.width !== Math.round(W * dpr)){ cv.width = Math.round(W * dpr); cv.height = Math.round(W * dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, W);
  const c = W / 2, k = (W / 2 - 8) / 3.8;
  g.strokeStyle = 'rgba(154,163,181,.25)'; g.lineWidth = 1;
  for(const r of [1, 2, 3]){ g.beginPath(); g.arc(c, c, r * k, 0, Math.PI * 2); g.stroke(); }
  // голова, нос смотрит вверх
  g.fillStyle = '#9aa3b5';
  g.beginPath(); g.arc(c, c, 8, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.moveTo(c - 5, c - 6); g.lineTo(c, c - 14); g.lineTo(c + 5, c - 6); g.fill();
  for(const v of voices){
    const z = zoneOf(v);
    if(z.spread){
      const mid = (z.d[0] + z.d[1]) / 2 * k;
      g.strokeStyle = v.color; g.globalAlpha = 0.2; g.lineWidth = (z.d[1] - z.d[0]) * k + 6; g.lineCap = 'round';
      g.beginPath(); g.arc(c, c, mid, (z.az - z.spread - 90) * Math.PI / 180, (z.az + z.spread - 90) * Math.PI / 180); g.stroke();
      g.globalAlpha = 1; g.lineCap = 'butt';
    }
    const q = zonePos(v, t), a = q.az * Math.PI / 180;
    g.fillStyle = v.color;
    g.beginPath(); g.arc(c + q.d * k * Math.sin(a), c - q.d * k * Math.cos(a), 6, 0, Math.PI * 2); g.fill();
  }
}
function moveTick(){
  const t = performance.now() / 1000;
  for(const p of peers.values()) applyPos(p, t);
  if(demo) applyPos(demo, t);
  drawRadar($('radar'), [...peers.values()], t);
  drawRadar($('radarDemo'), demo ? [demo] : [], t);
}

// ---------- демо ----------
let demoBuf = null;
$('demoZone').innerHTML = ZONE_OPTIONS;
$('demoZone').onchange = () => { if(demo) demo.place = $('demoZone').value; };
$('bDemo').onclick = async () => {
  await audio();
  $('start').classList.add('hidden'); $('demo').classList.remove('hidden');
  demo = Object.assign({place:$('demoZone').value || 'r', color:COLORS[0]}, phases());
  $('demoZone').value = demo.place;
  if(!demoBuf){
    $('demoMsg').textContent = T.demoLoading;
    try{
      const r = await fetch('/call-demo.mp3');
      if(!r.ok) throw new Error(r.status);
      demoBuf = await ctx.decodeAudioData(await r.arrayBuffer());
    }catch(e){ $('demoMsg').textContent = T.demoMissing; return; }
  }
  if(!demo) return;
  $('demoMsg').textContent = '';
  const src = new AudioBufferSourceNode(ctx, {buffer:demoBuf, loop:true});
  spatialChain(demo, src); src.start();
};
function stopDemo(){
  if(!demo) return;
  if(demo.src){ try{ demo.src.stop(); }catch(e){} demo.src.disconnect(); }
  if(demo.pan) demo.pan.disconnect();
  demo = null;
  $('demo').classList.add('hidden');
}
$('bDemoStop').onclick = () => { stopDemo(); $('start').classList.remove('hidden'); };
$('bDemoCall').onclick = () => { stopDemo(); $('start').classList.remove('hidden'); $('bStart').click(); };

// ---------- микрофон ----------
// Эхоподавление: на Android выключено (иначе BT-наушники уходят в моно), на компьютере включено
let proc = !/Android/i.test(navigator.userAgent);
try{ const v = localStorage.getItem('wispCallProc'); if(v !== null) proc = v === '1'; }catch(e){}
$('proc').checked = proc;
$('proc').onchange = async () => {
  proc = $('proc').checked;
  try{ localStorage.setItem('wispCallProc', proc ? '1' : '0'); }catch(e){}
  if(!micStream) return;
  try{ plugMic(await openMic($('dev').value)); }catch(e){ setStatus(T.micSwitch + e.name); }
};
function openMic(id){
  const a = {echoCancellation:proc, noiseSuppression:proc, autoGainControl:proc, channelCount:1};
  if(id) a.deviceId = {exact:id};
  return navigator.mediaDevices.getUserMedia({audio:a});
}
async function listMics(){
  return (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
}
async function getMic(){
  let saved = null;
  try{ saved = localStorage.getItem('wispCallMic'); }catch(e){}
  if(saved){ try{ return await openMic(saved); }catch(e){} }
  // первый раз: получаем разрешение, затем ищем встроенный микрофон телефона
  let s = await openMic(null);
  const sp = (await listMics()).find(d => /speakerphone/i.test(d.label));
  if(sp && sp.deviceId){
    s.getTracks().forEach(t => t.stop());
    s = await openMic(sp.deviceId);
  }
  return s;
}
function plugMic(s){
  if(micSrc) micSrc.disconnect();
  if(micStream && micStream !== s) micStream.getTracks().forEach(t => t.stop());
  micStream = s;
  micSrc = ctx.createMediaStreamSource(s);
  if(!fileSrc) micSrc.connect(micHP);
  const id = s.getAudioTracks()[0].getSettings().deviceId;
  if(id){ try{ localStorage.setItem('wispCallMic', id); }catch(e){} }
  fillMics(id);
}
async function fillMics(cur){
  const ds = await listMics();
  $('dev').innerHTML = ds.map((d, i) =>
    '<option value="' + esc(d.deviceId) + '">' + esc(d.label || T.mic + ' ' + (i + 1)) + '</option>').join('');
  if(cur) $('dev').value = cur;
}
$('dev').onchange = async () => {
  try{ plugMic(await openMic($('dev').value)); }catch(e){ setStatus(T.micSwitch + e.name); }
};
function buildMicChain(){
  micHP = new BiquadFilterNode(ctx, {type:'highpass', frequency:90, Q:0.7});
  micGain = new GainNode(ctx, {gain:1});
  micDest = ctx.createMediaStreamDestination();
  micHP.connect(micGain).connect(micDest);
  sendTrack = micDest.stream.getAudioTracks()[0];
  const an = ctx.createAnalyser(); an.fftSize = 512; micHP.connect(an);
  const arr = new Float32Array(an.fftSize);
  (function tick(){
    an.getFloatTimeDomainData(arr);
    let m = 0; for(const v of arr) m = Math.max(m, Math.abs(v));
    $('lvl').style.width = (muted ? 0 : Math.min(100, m * 140)) + '%';
    raf = requestAnimationFrame(tick);
  })();
}

// ---------- запись вместо микрофона ----------
function stopFile(){
  if(!fileSrc) return;
  try{ fileSrc.stop(); }catch(e){}
  fileSrc.disconnect(); fileSrc = null;
}
$('bFile').onclick = () => {
  if(fileSrc){
    stopFile();
    if(micSrc) micSrc.connect(micHP);
    $('bFile').textContent = T.file; $('bFile').classList.remove('on');
  }else $('file').click();
};
$('file').onchange = async () => {
  const f = $('file').files[0]; $('file').value = '';
  if(!f) return;
  try{
    const buf = await ctx.decodeAudioData(await f.arrayBuffer());
    stopFile();
    if(micSrc) micSrc.disconnect();
    fileSrc = new AudioBufferSourceNode(ctx, {buffer:buf, loop:true});
    fileSrc.connect(micHP); fileSrc.start();
    $('bFile').textContent = T.backMic; $('bFile').classList.add('on');
  }catch(e){ setStatus(T.fileFail + e.name); }
};
$('bMute').onclick = () => {
  muted = !muted;
  micGain.gain.value = muted ? 0 : 1;
  $('bMute').textContent = muted ? T.unmute : T.mute;
  $('bMute').classList.toggle('on', muted);
};

// ---------- собеседники ----------
// ?relay=1 - только через свой TURN, для проверки coturn
const FORCE_RELAY = new URLSearchParams(location.search).get('relay') === '1';

async function checkRoute(p){
  try{
    const st = await p.pc.getStats();
    let pair;
    st.forEach(r => { if(r.type === 'transport' && r.selectedCandidatePairId) pair = st.get(r.selectedCandidatePairId); });
    if(!pair) st.forEach(r => { if(r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') pair = r; });
    if(!pair) return;
    const l = st.get(pair.localCandidateId), r = st.get(pair.remoteCandidateId);
    p.via = ((l && l.candidateType === 'relay') || (r && r.candidateType === 'relay')) ? T.relay : T.direct;
    render();
  }catch(e){}
}
function attachRemote(p, stream){
  // Chrome не отдаёт звук звонка в Web Audio, пока поток не привязан к audio-элементу
  p.el = new Audio(); p.el.srcObject = stream; p.el.muted = true;
  p.el.play().catch(() => {});
  spatialChain(p, ctx.createMediaStreamSource(stream));
}
function makePeer(id){
  const pc = new RTCPeerConnection({iceServers:ICE, iceTransportPolicy: FORCE_RELAY ? 'relay' : 'all'});
  const p = Object.assign({id, pc, pending:[], place:freePlace(), color:freeColor(),
    name:tf(T.person, {n: ++peerNo}), state:'new'}, phases());
  pc.addTrack(sendTrack, micDest.stream);
  pc.onicecandidate = e => { if(e.candidate) send({type:'ice', to:id, candidate:e.candidate}); };
  pc.ontrack = e => { if(!p.el) attachRemote(p, e.streams[0] || new MediaStream([e.track])); };
  pc.onconnectionstatechange = () => {
    p.state = pc.connectionState; render();
    if(p.state === 'connected') setTimeout(() => checkRoute(p), 500);
  };
  peers.set(id, p); render();
  return p;
}
function flush(p){
  for(const c of p.pending) p.pc.addIceCandidate(c).catch(() => {});
  p.pending = [];
}
function dropPeer(id){
  const p = peers.get(id); if(!p) return;
  try{ p.pc.close(); }catch(e){}
  if(p.src) p.src.disconnect();
  if(p.pan) p.pan.disconnect();
  if(p.el) p.el.srcObject = null;
  peers.delete(id); render();
}
function render(){
  const box = $('peers'); if(!box) return;
  if(!peers.size){
    box.innerHTML = '<p class="small dim">' + T.nobody + '</p>';
    setStatus(T.waiting);
    return;
  }
  box.innerHTML = '';
  for(const p of peers.values()){
    const d = document.createElement('div'); d.className = 'peer';
    const cls = p.state === 'connected' ? 'st-ok' : (p.state === 'failed' || p.state === 'disconnected') ? 'st-bad' : 'dim';
    d.innerHTML = '<div class="top"><span><span class="dot" style="background:' + p.color + '"></span>' + esc(p.name) +
      '</span><span class="small ' + cls + '">' + (T.st[p.state] || p.state) +
      (p.state === 'connected' && p.via ? ', ' + p.via : '') + '</span></div>';
    const sel = document.createElement('select');
    sel.innerHTML = ZONE_OPTIONS; sel.value = p.place;
    sel.onchange = () => { p.place = sel.value; };
    d.appendChild(sel); box.appendChild(d);
  }
  const ok = [...peers.values()].filter(p => p.state === 'connected').length;
  const failed = [...peers.values()].some(p => p.state === 'failed');
  setStatus(failed ? T.failed : ok ? tf(T.ok, {n: ok}) : T.linking);
}

// ---------- сигнальный сервер ----------
function connect(){
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/call/ws/' + room);
  ws.onopen = () => { pingTimer = setInterval(() => send({type:'ping'}), 25000); };
  ws.onclose = () => { clearInterval(pingTimer); if(room) setStatus(T.lost); };
  ws.onmessage = async ev => {
    let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    try{
      if(m.type === 'welcome'){
        myId = m.id;
        render();
        for(const id of m.peers){
          const p = makePeer(id);
          await p.pc.setLocalDescription(await p.pc.createOffer());
          send({type:'offer', to:id, sdp:p.pc.localDescription});
        }
      }else if(m.type === 'join'){
        setStatus(T.joining);
      }else if(m.type === 'offer'){
        const p = peers.get(m.from) || makePeer(m.from);
        await p.pc.setRemoteDescription(m.sdp); flush(p);
        await p.pc.setLocalDescription(await p.pc.createAnswer());
        send({type:'answer', to:m.from, sdp:p.pc.localDescription});
      }else if(m.type === 'answer'){
        const p = peers.get(m.from);
        if(p){ await p.pc.setRemoteDescription(m.sdp); flush(p); }
      }else if(m.type === 'ice'){
        const p = peers.get(m.from); if(!p) return;
        if(p.pc.remoteDescription) p.pc.addIceCandidate(m.candidate).catch(() => {});
        else p.pending.push(m.candidate);
      }else if(m.type === 'leave'){
        dropPeer(m.from);
      }else if(m.type === 'full'){
        room = null; setStatus(T.full);
      }else if(m.type === 'error'){
        room = null; setStatus(T.badLink);
      }
    }catch(e){ setStatus(T.err + e.message); }
  };
}

// ---------- старт и конец ----------
const joinRoom = (new URLSearchParams(location.search).get('r') || '').replace(/[^a-z0-9_-]/gi, '').slice(0, 64);
$('bStart').textContent = joinRoom ? T.join : T.start;
function linkText(){ return location.origin + '/call?r=' + room; }

$('bStart').onclick = async () => {
  if(!navigator.mediaDevices){ $('startMsg').textContent = T.noMic; return; }
  $('bStart').disabled = true;
  try{
    await audio();
    if(!micHP) buildMicChain();
    plugMic(await getMic());
  }catch(e){
    $('startMsg').textContent = tf(T.micFail, {e: e.name});
    $('bStart').disabled = false; return;
  }
  try{
    const j = await (await fetch('/call/api/turn')).json();
    if(j.iceServers) ICE.push(...j.iceServers);
  }catch(e){}
  room = joinRoom || newRoom();
  history.replaceState(null, '', '/call?r=' + room + (FORCE_RELAY ? '&relay=1' : ''));
  $('link').textContent = linkText();
  $('start').classList.add('hidden'); $('call').classList.remove('hidden');
  setStatus(T.connecting);
  connect();
};

$('bShare').onclick = async () => {
  const url = linkText();
  if(navigator.share){
    try{ await navigator.share({title:T.title, text:T.shareText, url}); return; }catch(e){}
  }
  try{ await navigator.clipboard.writeText(url); $('bShare').textContent = T.copied; }
  catch(e){ $('bShare').textContent = T.copyAbove; }
  setTimeout(() => { $('bShare').textContent = T.share; }, 3000);
};

$('bEnd').onclick = () => {
  room = null;
  for(const id of [...peers.keys()]) dropPeer(id);
  if(ws) ws.close();
  clearInterval(pingTimer); clearInterval(moveTimer); cancelAnimationFrame(raf);
  if(micStream) micStream.getTracks().forEach(t => t.stop());
  if(ctx) ctx.close();
  $('call').innerHTML = '<section><p>' + T.ended + '</p><button onclick="location.href=\'/call\'">' + T.newCall + '</button></section>';
};
</script>
