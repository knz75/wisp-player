<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#02070a">
<meta name="description" content="Wisp - плеер, в котором вы сами решаете, где звучит звук: на плече, впереди, вдали или по орбите вокруг головы.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wisp">
<title>Wisp - эхо на плече</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #000; }
  body { min-height: 100vh; user-select: none; -webkit-user-select: none; }
  button, label, input { touch-action: manipulation; }
  svg.i { width: 22px; height: 22px; display: inline-block; vertical-align: middle; flex-shrink: 0; }
  .hidden { display: none !important; }
  /* Общие правила, на которые опираются все скины */
  #skin .ic-pause, #skin .ic-lock { display: none; }
  #skin.is-playing .ic-pause, #skin.is-locked .ic-lock { display: inline-block; }
  #skin.is-playing .ic-play, #skin.is-locked .ic-unlock { display: none; }
  #skin .need-multi { display: none; }
  #skin.multi .need-multi { display: block; }
  #skin .need-track { visibility: hidden; }
  #skin.has-track .need-track { visibility: visible; }
  #skin.is-locked [data-widget="presets"] { opacity: .35; pointer-events: none; }
  /* Заблокированный радар не держит палец - страница листается прямо по нему */
  #skin.is-locked [data-widget="radar"] canvas { touch-action: pan-y pinch-zoom; }
  #skin.is-radio [data-widget="seek"], #skin.is-radio .times { visibility: hidden; }
  #skin.is-plain [data-widget="radar"] canvas { opacity: .35; }
  /* Свёрнутая панель показывает только свой заголовок */
  #skin [data-fold] { cursor: pointer; }
  #skin .folded > :not([data-fold]) { display: none !important; }
  #skin [data-widget="radar"] canvas, #skin [data-widget="viz"] canvas { display: block; width: 100%; height: 100%; }
  #skin [data-widget="radar"] canvas { touch-action: none; }
  #skin [data-widget="ring"] svg { width: 100%; height: 100%; display: block; }
  .w-orbit .ob-shapes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .w-orbit .ob-s { padding: 0 !important; }
  .w-orbit .ob-s svg { width: 26px; height: 26px; display: block; }
  .w-orbit .ob-row { display: grid; grid-template-columns: 1fr 52px; gap: 5px; margin-top: 6px; }
  .w-orbit .ob-dir { font-size: 1.15rem !important; }
  .w-orbit .ob-l { display: flex; justify-content: space-between; align-items: baseline; font-size: .62rem; letter-spacing: 1px; text-transform: uppercase; opacity: .8; margin-top: 10px; }
  .w-orbit .ob-l b { font-variant-numeric: tabular-nums; font-size: .75rem; }
  .w-seek { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; touch-action: none; display: block; }
  .w-seek::-webkit-slider-runnable-track { height: var(--seek-h, 3px); background: linear-gradient(to right, var(--seek-c, #3ef0ff) var(--p, 0%), var(--seek-bg, #234) var(--p, 0%)); }
  .w-seek::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: calc(var(--seek-h, 3px) / 2 - 7px); border-radius: var(--seek-r, 2px); background: var(--seek-c, #3ef0ff); border: none; box-shadow: 0 0 8px var(--seek-c, #3ef0ff); }
  .w-seek::-moz-range-track { height: var(--seek-h, 3px); background: var(--seek-bg, #234); }
  .w-seek::-moz-range-progress { height: var(--seek-h, 3px); background: var(--seek-c, #3ef0ff); }
  .w-seek::-moz-range-thumb { width: 14px; height: 14px; border-radius: var(--seek-r, 2px); background: var(--seek-c, #3ef0ff); border: none; }

  /* Меню: не зависит от скина */
  .psheet { position: fixed; inset: 0; z-index: 50; overflow-y: auto; background: rgba(4,6,8,.97); color: #dfe7ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .psheet .in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .psheet .bar { display: flex; align-items: center; gap: 10px; }
  .psheet h2 { flex: 1; margin: 0; font-size: 1.05rem; }
  .psheet h3 { margin: 4px 0 0; font-size: .72rem; letter-spacing: 1.5px; text-transform: uppercase; color: #7d8b90; }
  .psheet .x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #2c3438; background: #11171a; color: #dfe7ea; font-size: 1rem; cursor: pointer; }
  .psheet .skins { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .psheet .sk { display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid #2c3438; border-radius: 12px; background: #0d1214; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .psheet .sk.on { border-color: #3ef0ff; box-shadow: 0 0 12px rgba(62,240,255,.35); }
  .psheet .sk .pv { width: 52px; height: 52px; flex-shrink: 0; border-radius: 10px; }
  .psheet .sk b { display: block; font-size: .92rem; }
  .psheet .sk small { color: #7d8b90; font-size: .78rem; line-height: 1.35; display: block; margin-top: 2px; }
  .psheet .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .psheet .mb { height: 44px; border: 1px solid #2c3438; border-radius: 10px; background: #11171a; color: #dfe7ea; font: inherit; font-size: .85rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0 6px; text-align: center; }
  .psheet .seg { display: flex; gap: 6px; }
  .psheet .seg .mb { flex: 1; }
  .psheet .seg .mb.on { border-color: #3ef0ff; color: #3ef0ff; }
  .psheet #helpText { font-size: .93rem; line-height: 1.55; }
  .psheet #helpText p { margin: 0 0 10px; user-select: text; -webkit-user-select: text; }
  .psheet #helpText b { color: #3ef0ff; }
  .psheet .tin { width: 100%; height: 44px; border: 1px solid #2c3438; border-radius: 10px; background: #0d1214; color: #dfe7ea; font: inherit; font-size: .9rem;
    padding: 0 12px; user-select: text; -webkit-user-select: text; }
  .psheet .tin:focus { outline: none; border-color: #3ef0ff; }
  .psheet select.tin { appearance: none; -webkit-appearance: none; cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, #7d8b90 50%), linear-gradient(135deg, #7d8b90 50%, transparent 50%); background-position: calc(100% - 18px) 19px, calc(100% - 12px) 19px; background-size: 6px 6px; background-repeat: no-repeat; }
  .psheet a.mb { text-decoration: none; }
  .psheet .note { margin: 0; font-size: .8rem; line-height: 1.45; color: #7d8b90; }
  #stList { display: flex; flex-direction: column; gap: 6px; }
  #stList .st { display: flex; align-items: center; gap: 6px; border: 1px solid #2c3438; border-radius: 12px; background: #0d1214; padding: 4px 4px 4px 0; }
  #stList .st.on { border-color: #3ef0ff; }
  #stList .sp { flex: 1; min-width: 0; text-align: left; background: none; border: none; color: inherit; font: inherit; padding: 8px 10px; cursor: pointer; }
  #stList .sp b { display: block; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stList .sp small { display: block; font-size: .72rem; color: #7d8b90; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stList .bd { font-size: .68rem; font-weight: 700; color: #7dff9a; flex-shrink: 0; }
  #stList .del { width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid #2c3438; background: #11171a; color: #7d8b90; cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
    z-index: 60; max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 12px; background: rgba(20,26,30,.96); border: 1px solid #2c3438; color: #dfe7ea;
    font: 600 .85rem -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; transition: opacity .25s, transform .25s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

const SKINS = [];

// ---------------- 1. DRONE HUD ----------------
SKINS.push({
  id: 'hud',
  name: { ru: 'Drone HUD', pl: 'Drone HUD', en: 'Drone HUD' },
  desc: { ru: 'Тактический экран дрона: векторная сетка, развёртка радара, прицел на цели.',
          pl: 'Taktyczny ekran drona: siatka wektorowa, przemiatanie radaru, celownik.',
          en: 'Tactical drone display: vector grid, radar sweep, target reticle.' },
  preview: 'radial-gradient(circle at 50% 50%, transparent 30%, #3ef0ff 31%, transparent 33%, transparent 60%, rgba(62,240,255,.5) 61%, transparent 63%), linear-gradient(135deg,#02080b,#062026)',
  viz: 'wave',
  radar: { r: 120, pad: 22, rings: 'dense', ticks: 'deg', sweep: true, beam: 'dashed', reticle: true, head: 'vector', dist: true, cross: true },
  css: `
#skin { --c:#3ef0ff; --c2:#7dff9a; --w:#ffb020; --bg:#02070a; --pn:rgba(6,22,28,.62); --ln:rgba(62,240,255,.24); --tx:#cdeff6; --dm:#5b8792;
  --r-bg:rgba(1,10,14,.85); --r-grid:#3ef0ff; --r-acc:#7dff9a; --r-acc2:#3ef0ff; --r-txt:#6fa9b6; --r-lock:#ffb020;
  --v-a:#7dff9a; --v-b:#3ef0ff; --seek-c:#3ef0ff; --seek-bg:rgba(62,240,255,.15); --theme:#02070a;
  min-height:100vh; color:var(--tx); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(18px + env(safe-area-inset-bottom,0px));
  background:
    radial-gradient(ellipse 90% 45% at 50% -5%, rgba(62,240,255,.20), transparent 70%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(125,255,154,.08), transparent 70%),
    repeating-linear-gradient(0deg, rgba(62,240,255,.045) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(62,240,255,.045) 0 1px, transparent 1px 28px), var(--bg); }
#skin::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); mix-blend-mode:multiply; }
#skin .hud { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:10px; position:relative; z-index:2; }
#skin .top { display:flex; align-items:center; gap:10px; }
#skin .logo { width:40px; height:40px; color:var(--c); filter:drop-shadow(0 0 5px var(--c)); flex-shrink:0; }
#skin .logo svg { width:100%; height:100%; }
#skin .brand { flex:1; min-width:0; line-height:1.15; }
#skin .brand b { font-size:1.05rem; letter-spacing:4px; white-space:nowrap; color:#fff; text-shadow:0 0 10px rgba(62,240,255,.6); }
#skin .brand b i { font-style:normal; color:var(--c); }
#skin .st { font-size:.62rem; letter-spacing:2px; color:var(--dm); text-transform:uppercase; display:flex; align-items:center; gap:6px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#skin.no-track .st { text-transform:none; letter-spacing:.5px; color:var(--c); font-size:.62rem; }
#skin.no-track .st::before { display:none; }
#skin .st::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--dm); }
#skin.is-playing .st { color:var(--c2); }
#skin.is-playing .st::before { background:var(--c2); box-shadow:0 0 8px var(--c2); animation:blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity:.2; } }
#skin .sq { width:40px; height:40px; flex-shrink:0; border:1px solid var(--ln); background:rgba(62,240,255,.05); color:var(--c);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
#skin .pn { position:relative; padding:10px; border:1px solid var(--ln);
  background:
   linear-gradient(var(--c),var(--c)) top left/14px 2px no-repeat, linear-gradient(var(--c),var(--c)) top left/2px 14px no-repeat,
   linear-gradient(var(--c),var(--c)) top right/14px 2px no-repeat, linear-gradient(var(--c),var(--c)) top right/2px 14px no-repeat,
   linear-gradient(var(--c),var(--c)) bottom left/14px 2px no-repeat, linear-gradient(var(--c),var(--c)) bottom left/2px 14px no-repeat,
   linear-gradient(var(--c),var(--c)) bottom right/14px 2px no-repeat, linear-gradient(var(--c),var(--c)) bottom right/2px 14px no-repeat,
   var(--pn);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
#skin .ph { display:flex; justify-content:space-between; gap:8px; font-size:.62rem; letter-spacing:2px; text-transform:uppercase; color:var(--c); margin-bottom:8px; }
#skin .ph span:first-child::before { content:'▸ '; }
#skin .ph .r { color:var(--dm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#skin .now { display:flex; align-items:center; gap:10px; }
#skin .play { width:56px; height:56px; flex-shrink:0; border:1px solid var(--c2); color:var(--c2); background:rgba(125,255,154,.08); cursor:pointer;
  display:flex; align-items:center; justify-content:center; box-shadow:0 0 14px rgba(125,255,154,.25), inset 0 0 12px rgba(125,255,154,.15);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
#skin .play svg { width:26px; height:26px; }
#skin.no-track .play { animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow:0 0 24px rgba(125,255,154,.6), inset 0 0 16px rgba(125,255,154,.3); } }
#skin .meta { flex:1; min-width:0; }
#skin .tt { color:var(--c2); font-size:.86rem; font-weight:600; letter-spacing:1px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 0 8px rgba(125,255,154,.4); }
#skin .tm { display:flex; align-items:baseline; gap:8px; margin-top:2px; }
#skin .tm b { font-size:1.75rem; font-weight:300; letter-spacing:2px; color:#fff; text-shadow:0 0 12px rgba(62,240,255,.55); font-variant-numeric:tabular-nums; }
#skin .tm small { font-size:.7rem; color:var(--dm); font-variant-numeric:tabular-nums; white-space:nowrap; }
#skin .viz { height:46px; margin:8px 0 2px; border-top:1px dashed var(--ln); border-bottom:1px dashed var(--ln); }
#skin .times { display:flex; justify-content:space-between; font-size:.62rem; color:var(--dm); letter-spacing:1px; margin-top:-2px; }
#skin .tr { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px; }
#skin .hb, #skin .wb { height:40px; border:1px solid var(--ln); background:rgba(62,240,255,.05); color:var(--c); font:inherit; font-size:.7rem;
  letter-spacing:1px; text-transform:uppercase; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; min-width:0;
  white-space:nowrap; overflow:hidden; padding:0 4px;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px); }
#skin .hb:active, #skin .wb:active { background:rgba(62,240,255,.18); }
#skin .wb.on { background:var(--c); color:#001218; box-shadow:0 0 14px rgba(62,240,255,.5); font-weight:700; }
#skin .rbox { position:relative; width:100%; max-width:340px; margin:0 auto; }
#skin .radar { width:100%; aspect-ratio:1/1; }
#skin .rlock { position:absolute; top:0; right:0; width:40px; height:40px; padding:0; display:flex; align-items:center; justify-content:center; cursor:pointer;
  border:1px solid rgba(125,255,154,.45); background:rgba(2,10,14,.85); color:var(--c2); font:inherit; font-size:.62rem; letter-spacing:1px; text-transform:uppercase;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px); }
#skin .rlock svg { width:20px; height:20px; }
#skin.is-locked .rlock { color:var(--w); border-color:var(--w); background:rgba(40,24,0,.9); box-shadow:0 0 14px rgba(255,176,32,.45); }
#skin .ph[data-fold] span:first-child::before { content:'▾ '; }
#skin .folded .ph[data-fold] span:first-child::before { content:'▸ '; }
#skin .folded .ph { margin-bottom:0; }
#skin.is-locked .radar { opacity:.65; }
#skin .ro { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:6px; }
#skin .ro div { border:1px solid var(--ln); padding:5px 6px; background:rgba(0,0,0,.25); min-width:0; }
#skin .ro small { display:block; font-size:.55rem; letter-spacing:2px; color:var(--dm); }
#skin .ro b { display:block; font-size:.85rem; color:var(--c); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#skin.is-locked .ro .lkv b { color:var(--w); }
#skin .presets { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
#skin .mods { display:grid; grid-template-columns:1fr; gap:10px; }
@media (min-width:520px) { #skin .mods { grid-template-columns:1fr 1fr; } }
#skin .md small { display:block; font-size:.58rem; letter-spacing:2px; color:var(--dm); text-transform:uppercase; margin-bottom:5px; }
#skin .md .row { display:flex; gap:5px; }
#skin .md .row .wb { flex:1; }
#skin .lockb { width:100%; color:var(--c2); border-color:rgba(125,255,154,.4); }
#skin.is-locked .lockb { color:var(--w); border-color:var(--w); background:rgba(255,176,32,.1); box-shadow:0 0 12px rgba(255,176,32,.35); }
#skin .files { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:6px; }
#skin .files .hb { letter-spacing:0; }
#skin.no-track .files .hb { border-color:var(--c2); color:var(--c2); }
#skin .ob-s { height:44px; color:var(--dm); }
#skin .ob-s.on { color:#001218; }
#skin.orbiting .ph .r { color:var(--c2); }
#skin .ob-l { color:var(--dm); }
#skin .ob-l b { color:var(--c); }
#skin .list { max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; }
#skin .li { display:flex; justify-content:space-between; gap:8px; padding:7px 8px; font-size:.75rem; border-left:2px solid transparent; cursor:pointer; background:rgba(62,240,255,.03); }
#skin .li .n { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
#skin .li .t { color:var(--dm); flex-shrink:0; }
#skin .li.cur { border-left-color:var(--c2); color:var(--c2); background:rgba(125,255,154,.07); }

function load(i) {
  if (i < 0 || i >= S.tracks.length) return;
  stopRadio();
  savePos(); S.cur = i; S.ready = false;
  const f = S.tracks[i], saved = store.get(keyOf(f), null);
  if (audioEl.src) URL.revokeObjectURL(audioEl.src);
  audioEl.src = URL.createObjectURL(f);
  audioEl.onloadedmetadata = () => {
    audioEl.playbackRate = S.speed;
    if (saved && saved.t > 0 && saved.t < audioEl.duration - 5) audioEl.currentTime = saved.t;
    S.ready = true; render();
  };
  startPlay();
  setupMediaSession(f.name); renderList(); render(); resizeAll(); requestDraw();
}
// Запуск с повтором: если браузер не дал начать сразу (экран погашен, файл ещё не прочитан) - пробуем, когда файл готов
function startPlay() {
  audioEl.play().catch(() => {
    audioEl.addEventListener('canplay', function again() { audioEl.removeEventListener('canplay', again); if (!S.radio) audioEl.play().catch(() => {}); });
  });
}
// Битый или неподдерживаемый файл: не останавливаемся, а идём дальше (но не больше 5 подряд)
let badInRow = 0;
audioEl.addEventListener('error', () => {
  if (S.radio || S.cur < 0) return;
  badInRow++;
  toast(t('skipBad') + ': ' + stripExt(S.tracks[S.cur].name));
  if (badInRow <= 5 && S.cur < S.tracks.length - 1) load(S.cur + 1);
});
audioEl.addEventListener('playing', () => { badInRow = 0; if (ac && ac.state !== 'running') ac.resume(); });
const AUDIO_RE = /\.(mp3|m4a|m4b|aac|ogg|oga|opus|wav|flac|webm|mka)$/i;
function takeFiles(e) {
  const files = [...e.target.files].filter(f => (f.type || '').startsWith('audio/') || AUDIO_RE.test(f.name));
  e.target.value = '';
  if (!files.length) { if (e.target.id === 'dirInput') alert(t('noAudio')); return; }
  initAudio(); savePos();
  const path = f => f.webkitRelativePath || f.name;
  files.sort((a, b) => path(a).localeCompare(path(b), undefined, { numeric: true }));
  S.tracks = files; S.cur = -1;
  let best = 0, bestAt = -1;
  files.forEach((f, i) => { const s = store.get(keyOf(f), null); if (s && s.at > bestAt) { bestAt = s.at; best = i; } });
  load(best);
}
$('fileInput').addEventListener('change', takeFiles);
$('dirInput').addEventListener('change', takeFiles);
audioEl.addEventListener('timeupdate', () => { render(); if (Date.now() - lastSave > 5000) { lastSave = Date.now(); savePos(); } });
audioEl.addEventListener('play', () => { render(); requestDraw(); try { navigator.mediaSession.playbackState = 'playing'; } catch (e) {} });
audioEl.addEventListener('pause', () => { render(); savePos(); requestDraw(); try { navigator.mediaSession.playbackState = 'paused'; } catch (e) {} });
audioEl.addEventListener('ended', () => {
  if (S.cur >= 0) store.set(keyOf(S.tracks[S.cur]), { t: 0, at: Date.now() });
  S.ready = false; if (S.cur < S.tracks.length - 1) load(S.cur + 1);
});
window.addEventListener('pagehide', savePos);
// Сторож: играет, но время стоит 10 секунд - пинаем плеер
let lastT = -1, stuckFor = 0;
setInterval(() => {
  if (S.radio || S.cur < 0 || audioEl.paused || audioEl.ended) { stuckFor = 0; return; }
  if (audioEl.currentTime === lastT) { stuckFor++; if (stuckFor >= 5) { stuckFor = 0; if (ac && ac.state !== 'running') ac.resume(); audioEl.play().catch(() => {}); } }
  else { stuckFor = 0; lastT = audioEl.currentTime; }
}, 2000);
function skip(sec) {
  if (S.radio) return; // в прямом эфире перематывать некуда
  const max = isFinite(audioEl.duration) ? audioEl.duration : Infinity; audioEl.currentTime = Math.min(max, Math.max(0, audioEl.currentTime + sec)); }
function setupMediaSession(title) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: stripExt(title), artist: 'Wisp · ' + t('tagline') });
  const h = { play: () => M().play(), pause: () => M().pause(), seekbackward: () => skip(-30), seekforward: () => skip(30),
    previoustrack: () => S.radio ? stepStation(-1) : load(S.cur - 1), nexttrack: () => S.radio ? stepStation(1) : load(S.cur + 1) };
  for (const k in h) { try { navigator.mediaSession.setActionHandler(k, h[k]); } catch (e) {} }
}
function setSpeed(v) { S.speed = v; if (!S.radio) audioEl.playbackRate = v; store.set('pp_speed', v); render(); }

// ---------------- Радио ----------------
const DEFAULT_ST = [
  { name: 'Радио Фантастики', url: 'https://myradio24.org/55699' },
  { name: 'Радио Фантастики · 32k', url: 'https://myradio24.org/55699_32' }
];
let stations = store.get('pp_stations', DEFAULT_ST);
let radioTry = 0;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 3500);
}
function stopRadio() {
  if (!S.radio) return;
  S.radio = null; S.plain = false;
  audioEl.onplaying = audioEl.onerror = null;
  audioPlain.pause(); audioPlain.removeAttribute('src'); audioPlain.load();
  audioEl.pause(); audioEl.removeAttribute('crossorigin');
}
function playStation(st) {
  savePos();
  if (S.radio) stopRadio(); else { audioEl.pause(); if (audioEl.src.startsWith('blob:')) URL.revokeObjectURL(audioEl.src); }
  S.tracks = []; S.cur = -1; S.ready = false; renderList();
  S.radio = st; S.plain = false;
  const my = ++radioTry;
  initAudio();
  // Просим поток с разрешением на обработку. Не дал разрешения - поток не откроется, и мы переключимся на стерео.
  audioEl.crossOrigin = 'anonymous';
  audioEl.onloadedmetadata = null;
  audioEl.playbackRate = 1;
  audioEl.src = st.url;
  let started = false;
  audioEl.onplaying = () => { if (my !== radioTry) return; if (!started) { started = true; mark(st, true); } };
  audioEl.onerror = () => {
    if (my !== radioTry || S.plain) return;
    if (!started) startPlain(st, my);                                   // скорее всего, станция не разрешает 3D
    else setTimeout(() => { if (my === radioTry && S.radio === st) { audioEl.src = st.url; audioEl.play().catch(() => {}); } }, 2000); // обрыв - переподключаемся
  };
  audioEl.play().catch(() => {});
  setupMediaSession(st.name); render(); requestDraw();
}
function startPlain(st, my) {
  audioEl.onerror = null; audioEl.removeAttribute('src'); audioEl.load();
  S.plain = true;
  audioPlain.src = st.url;
  audioPlain.onplaying = () => { if (my === radioTry) { mark(st, false); toast(t('no3d')); } audioPlain.onplaying = null; };
  audioPlain.onerror = () => { if (my === radioTry && S.radio === st) { toast(t('streamFail')); stopRadio(); render(); } };
  audioPlain.play().catch(() => {});
  render(); requestDraw();
}
function mark(st, d3) {
  const s = stations.find(x => x.url === st.url); if (s && s.d3 !== d3) { s.d3 = d3; store.set('pp_stations', stations); }
  renderStations();
}
function stepStation(k) {
  if (!stations.length) return;
  const i = stations.findIndex(x => S.radio && x.url === S.radio.url);
  playStation(stations[((i < 0 ? 0 : i + k) % stations.length + stations.length) % stations.length]);
}
['play', 'pause', 'timeupdate'].forEach(ev => audioPlain.addEventListener(ev, () => { render(); requestDraw(); }));

function renderStations() {
  const box = $('stList'); if (!box) return; box.innerHTML = '';
  stations.forEach((st, i) => {
    const row = document.createElement('div'); row.className = 'st' + (S.radio && S.radio.url === st.url ? ' on' : '');
    row.innerHTML = '<button class="sp"><b></b><small></small></button><span class="bd"></span><button class="del">✕</button>';
    row.querySelector('b').textContent = st.name;
    row.querySelector('small').textContent = st.url;
    row.querySelector('.bd').textContent = st.d3 === true ? '3D' : st.d3 === false ? t('stereo') : '';
    row.querySelector('.sp').addEventListener('click', () => { playStation(st); closeRadio(); });
    row.querySelector('.del').addEventListener('click', () => { stations.splice(i, 1); store.set('pp_stations', stations); renderStations(); });
    box.appendChild(row);
  });
}
function readStation() {
  const url = $('stUrl').value.trim();
  if (!/^https:\/\/[^\s]+$/i.test(url)) { toast(t('badUrl')); return null; }
  let name = $('stName').value.trim();
  if (!name) { try { name = new URL(url).hostname.replace(/^www\./, ''); } catch (e) { name = url; } }
  return { name: name.slice(0, 60), url };
}
function addStation(st) {
  if (!stations.some(x => x.url === st.url)) { stations.push(st); store.set('pp_stations', stations); }
  $('stUrl').value = ''; $('stName').value = ''; renderStations();
}
$('stSave').addEventListener('click', () => { const st = readStation(); if (st) addStation(st); });
$('stPlay').addEventListener('click', () => { const st = readStation(); if (st) { addStation(st); playStation(stations.find(x => x.url === st.url)); closeRadio(); } });
function openRadio() { renderStations(); $('radioSheet').classList.remove('hidden'); }
function closeRadio() { $('radioSheet').classList.add('hidden'); }
$('radioClose').addEventListener('click', closeRadio);

// ---------------- Таймер сна ----------------
let sleepTick = null, fading = false;
function setSleep(min) {
  clearInterval(sleepTick); sleepTick = null; fading = false;
  if (master) { master.gain.cancelScheduledValues(ac.currentTime); master.gain.setValueAtTime(1, ac.currentTime); }
  S.sleepMin = min; S.sleepEnd = min ? Date.now() + min * 60000 : 0;
  if (min) sleepTick = setInterval(() => {
    const left = (S.sleepEnd - Date.now()) / 1000;
    if (left <= 10 && !fading && master) { fading = true; master.gain.setTargetAtTime(0, ac.currentTime, 3); }
    if (left <= 0) { M().pause(); setSleep(0); return; }
    render();
  }, 1000);
  render();
}
setInterval(() => { if (W.txt.some(el => el.dataset.txt === 'clock')) render(); }, 15000);

// ---------------- Скины: выбор, файл, проверка ----------------
let custom = store.get('pp_custom', null);
let skinId = store.get('pp_skin', SKINS[0].id);
const allSkins = () => custom ? SKINS.concat([custom]) : SKINS;

function useSkin(id) {
  const sk = allSkins().find(s => s.id === id) || SKINS[0];
  skinId = sk.id; store.set('pp_skin', skinId); mountSkin(sk); renderSkinList();
}
function renderSkinList() {
  const box = $('skinList'); box.innerHTML = '';
  allSkins().forEach(sk => {
    const b = document.createElement('button'); b.className = 'sk' + (sk.id === skinId ? ' on' : '');
    b.innerHTML = '<span class="pv"></span><span><b></b><small></small></span>';
    b.querySelector('.pv').style.background = sk.preview || '#222';
    b.querySelector('b').textContent = L(sk.name) || t('custom');
    b.querySelector('small').textContent = L(sk.desc);
    b.addEventListener('click', () => { useSkin(sk.id); closeMenu(); });
    box.appendChild(b);
  });
}
function openMenu() { renderSkinList(); $('menu').classList.remove('hidden'); }
function closeMenu() { $('menu').classList.add('hidden'); }
$('menuClose').addEventListener('click', closeMenu);
$('langSel').innerHTML = LANGS.map(([k, n]) => `<option value="${k}">${n}</option>`).join('');
$('langSel').addEventListener('change', e => { lang = e.target.value; store.set('pp_lang', lang); applyLang(); });

// ---------------- Обратная связь ----------------
const FEEDBACK_URL = 'https://t.me/WispPlayer_bot'; // отзывы - в Telegram-бота
if (FEEDBACK_URL) $('fbLink').href = FEEDBACK_URL; else $('fbLink').classList.add('hidden');

// ---------------- Своя статистика: тихие отметки в журнал сервера ----------------
// Без cookies и без личных данных: только «что произошло» и язык. Каждая отметка - раз за запуск.
const pinged = {};
function ping(ev) {
  if (pinged[ev] || location.protocol !== 'https:') return;
  pinged[ev] = 1;
  try {
    const app = window.matchMedia && matchMedia('(display-mode: standalone)').matches ? 'app' : 'web';
    fetch('/e/' + ev + '?l=' + lang + '&m=' + app, { cache: 'no-store', keepalive: true }).catch(() => {});
  } catch (e) {}
}
ping('open');
window.addEventListener('appinstalled', () => ping('install'));
audioEl.addEventListener('play', () => ping(S.radio ? 'radio' : 'play'));
audioPlain.addEventListener('play', () => ping('radio'));

$('expSkin').addEventListener('click', () => {
  const sk = allSkins().find(s => s.id === skinId) || SKINS[0];
  const data = { parrotSkin: 2, name: sk.name, desc: sk.desc, preview: sk.preview, css: sk.css, html: sk.html, radar: sk.radar, viz: sk.viz };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
  a.download = 'wisp-skin-' + (typeof sk.name === 'string' ? sk.name : (sk.name.en || 'skin')).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

// Чужой скин может менять вид, но не может выполнять код и ничего не грузит из сети
const ACTS = ['play', 'open', 'openDir', 'radio', 'orbit', 'echo', 'prev', 'next', 'back', 'fwd', 'lock', 'fx', 'speed', 'sleep', 'menu'];
function cleanHtml(html) {
  const doc = new DOMParser().parseFromString('<div id="x">' + html + '</div>', 'text/html');
  doc.querySelectorAll('script,iframe,object,embed,link,meta,style,base,form,frame,frameset,template,audio,video,img,source').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(a => {
      const n = a.name.toLowerCase(), v = a.value.trim();
      if (n.startsWith('on')) el.removeAttribute(a.name);
      else if (['href', 'xlink:href', 'src', 'action', 'formaction', 'srcset', 'background'].includes(n) && !v.startsWith('#')) el.removeAttribute(a.name);
      else if (n === 'style' && /url\s*\(|expression|@import/i.test(v)) el.removeAttribute(a.name);
      else if (n === 'data-act' && !ACTS.includes(v)) el.removeAttribute(a.name);
    });
  });
  return doc.getElementById('x').innerHTML;
}
function cleanCss(css) {
  return String(css)
    .replace(/@import[^;]*;?/gi, '')
    .replace(/url\s*\(\s*(['"]?)\s*(?!data:image\/(png|jpeg|webp|gif|svg\+xml)[;,])[^)]*\)/gi, 'none')
    .replace(/expression\s*\(/gi, '(')
    .replace(/<\/?style/gi, '');
}
function cleanRadar(r) {
  const o = {}, pick = (k, ok) => { if (r && ok(r[k])) o[k] = r[k]; };
  pick('r', v => typeof v === 'number' && v >= 80 && v <= 140);
  pick('pad', v => typeof v === 'number' && v >= 0 && v <= 20);
  pick('rings', v => ['meters', 'dense', 'soft'].includes(v));
  pick('ticks', v => ['deg', 'hours', 'none'].includes(v));
  pick('beam', v => ['solid', 'dashed', 'none'].includes(v));
  pick('head', v => ['vector', 'dot'].includes(v));
  ['cross', 'diag', 'sweep', 'reticle', 'dist', 'you', 'label'].forEach(k => pick(k, v => typeof v === 'boolean'));
  pick('font', v => typeof v === 'string' && /^[\w\s,'"-]{1,80}$/.test(v));
  return o;
}
const cleanName = v => typeof v === 'string' ? v.slice(0, 40) : (v && typeof v === 'object') ? Object.fromEntries(Object.entries(v).filter(([k, s]) => /^[a-z]{2}$/.test(k) && typeof s === 'string').map(([k, s]) => [k, s.slice(0, 120)])) : '';
$('skinFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (f.size > 1500000) { alert(t('big')); return; }
  f.text().then(txt => {
    const d = JSON.parse(txt);
    if (!d || d.parrotSkin !== 2 || typeof d.html !== 'string' || typeof d.css !== 'string') throw 0;
    const sk = { id: 'custom', name: cleanName(d.name) || t('custom'), desc: cleanName(d.desc),
      preview: typeof d.preview === 'string' && !/url|expression|;/i.test(d.preview) ? d.preview.slice(0, 300) : '#333',
      css: cleanCss(d.css), html: cleanHtml(d.html), radar: cleanRadar(d.radar), viz: ['bars', 'wave', 'blocks', 'none'].includes(d.viz) ? d.viz : 'bars' };
    if (!store.set('pp_custom', sk)) { alert(t('big')); return; }
    custom = sk; useSkin('custom'); closeMenu();
  }).catch(() => alert(t('bad')));
});

// ---------------- Установка как приложение: работа без интернета ----------------
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

// ---------------- Старт ----------------
useSkin(skinId);

</script>
</body>
</html>
