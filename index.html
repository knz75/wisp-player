Object.assign(HELP, {
  uk: `<p><b>Потрібні навушники.</b> Без них простору не буде.</p>
<p><b>Файли / Папка.</b> Можна вибрати кілька розділів або цілу папку - плеєр пам’ятає, де ви зупинилися в кожному.</p>
<p><b>Радар.</b> У центрі - ви. Тягніть папугу Wisp - і звук переїде туди. Ближче - гучніше й чистіше, далі - тихіше й глухіше.</p>
<p><b>Орбіта.</b> Папуга сам літає обраною фігурою. Добре тренує слух: з часом «попереду» і «позаду» розрізняти легше. Для роботи поставте звук далеко попереду збоку - він не заважатиме думати.</p>
<p><b>3D звук: Вимк.</b> - звичайне стерео, щоб порівняти. <b>Замок</b> - щоб у кишені нічого не зрушило. <b>Таймер сну</b> - наприкінці звук плавно стихає. <b>Кімната</b> - відчуття відстані; для книжок її можна вимкнути.</p>
<p><b>Скіни</b> змінюють увесь вигляд плеєра, а не лише кольори. Скін - це файл: його можна зберегти, переробити й надіслати другові.</p>
<p>Ліво й право чують усі. «Попереду» і «позаду» дехто плутає - це нормально для навушників.</p>`,
  de: `<p><b>Kopfhörer nötig.</b> Ohne sie gibt es keinen Raum.</p>
<p><b>Dateien / Ordner.</b> Wähle mehrere Kapitel oder einen ganzen Ordner - der Player merkt sich, wo du in jedem aufgehört hast.</p>
<p><b>Radar.</b> Du bist in der Mitte. Zieh den Papagei Wisp, und der Klang wandert dorthin. Näher ist lauter und klarer, weiter weg leiser und dumpfer.</p>
<p><b>Orbit.</b> Der Papagei fliegt von selbst die gewählte Figur. Gutes Hörtraining: Mit der Zeit lassen sich „vorne“ und „hinten“ leichter unterscheiden. Zum Arbeiten den Klang weit nach vorne zur Seite setzen - er stört das Denken nicht.</p>
<p><b>3D-Klang: Aus</b> - normales Stereo zum Vergleich. <b>Sperre</b> - damit sich in der Tasche nichts verschiebt. <b>Schlaftimer</b> - am Ende wird der Ton sanft leiser. <b>Hall</b> - Gefühl von Entfernung; für Hörbücher abschalten.</p>
<p><b>Skins</b> ändern den ganzen Player, nicht nur die Farben. Ein Skin ist eine Datei: speichern, umbauen, an Freunde schicken.</p>
<p>Links und rechts hört jeder. „Vorne“ und „hinten“ verwechseln manche - das ist bei Kopfhörern normal.</p>`,
  es: `<p><b>Necesitas auriculares.</b> Sin ellos no hay espacio.</p>
<p><b>Archivos / Carpeta.</b> Elige varios capítulos o una carpeta entera: el reproductor recuerda dónde te quedaste en cada uno.</p>
<p><b>Radar.</b> Tú estás en el centro. Arrastra al loro Wisp y el sonido se moverá allí. Más cerca suena más fuerte y claro; más lejos, más bajo y apagado.</p>
<p><b>Órbita.</b> El loro vuela solo siguiendo la figura elegida. Buen entrenamiento auditivo: con el tiempo cuesta menos distinguir «delante» y «detrás». Para trabajar, pon el sonido lejos, delante y a un lado: no te molestará al pensar.</p>
<p><b>Sonido 3D: No</b> - estéreo normal para comparar. <b>Bloqueo</b> - para que nada se mueva en el bolsillo. <b>Temporizador</b> - al final el sonido se apaga suavemente. <b>Sala</b> - sensación de distancia; desactívala para audiolibros.</p>
<p><b>Las skins</b> cambian todo el reproductor, no solo los colores. Una skin es un archivo: guárdala, modifícala, envíasela a un amigo.</p>
<p>Izquierda y derecha las oye todo el mundo. «Delante» y «detrás» a veces se confunden: es normal con auriculares.</p>`,
  fr: `<p><b>Écouteurs indispensables.</b> Sans eux, pas d’espace.</p>
<p><b>Fichiers / Dossier.</b> Choisis plusieurs chapitres ou un dossier entier - le lecteur se souvient où tu t’es arrêté dans chacun.</p>
<p><b>Radar.</b> Tu es au centre. Fais glisser le perroquet Wisp et le son s’y déplace. Plus près, c’est plus fort et plus net ; plus loin, plus doux et plus sourd.</p>
<p><b>Orbite.</b> Le perroquet vole seul selon la figure choisie. Bon entraînement de l’oreille : avec le temps, « devant » et « derrière » se distinguent mieux. Pour travailler, place le son loin devant, sur le côté - il ne gênera pas ta réflexion.</p>
<p><b>Son 3D : Non</b> - stéréo normale pour comparer. <b>Verrou</b> - pour que rien ne bouge dans la poche. <b>Minuterie</b> - à la fin, le son baisse doucement. <b>Pièce</b> - sensation de distance ; à couper pour les livres audio.</p>
<p><b>Les skins</b> changent tout le lecteur, pas seulement les couleurs. Un skin est un fichier : enregistre-le, modifie-le, envoie-le à un ami.</p>
<p>Tout le monde entend la gauche et la droite. Certains confondent « devant » et « derrière » - c’est normal au casque.</p>`,
  it: `<p><b>Servono le cuffie.</b> Senza, lo spazio non c’è.</p>
<p><b>File / Cartella.</b> Scegli più capitoli o un’intera cartella: il player ricorda dove ti sei fermato in ognuno.</p>
<p><b>Radar.</b> Tu sei al centro. Trascina il pappagallo Wisp e il suono si sposta lì. Più vicino è più forte e nitido, più lontano più piano e ovattato.</p>
<p><b>Orbita.</b> Il pappagallo vola da solo lungo la figura scelta. Ottimo allenamento dell’udito: col tempo distinguere «davanti» e «dietro» diventa più facile. Per lavorare, metti il suono lontano, davanti e di lato: non disturberà i pensieri.</p>
<p><b>Suono 3D: No</b> - stereo normale per confrontare. <b>Blocco</b> - così in tasca non si sposta nulla. <b>Timer</b> - alla fine il suono si spegne dolcemente. <b>Stanza</b> - senso di distanza; per gli audiolibri si può disattivare.</p>
<p><b>Le skin</b> cambiano tutto il player, non solo i colori. Una skin è un file: salvala, modificala, mandala a un amico.</p>
<p>Sinistra e destra le sentono tutti. Qualcuno confonde «davanti» e «dietro»: con le cuffie è normale.</p>`,
  pt: `<p><b>Precisa de fones.</b> Sem eles não há espaço.</p>
<p><b>Arquivos / Pasta.</b> Escolha vários capítulos ou uma pasta inteira - o player lembra onde você parou em cada um.</p>
<p><b>Radar.</b> Você está no centro. Arraste o papagaio Wisp e o som vai para lá. Mais perto fica mais alto e nítido; mais longe, mais baixo e abafado.</p>
<p><b>Órbita.</b> O papagaio voa sozinho pela figura escolhida. Ótimo treino para o ouvido: com o tempo fica mais fácil distinguir “frente” e “trás”. Para trabalhar, coloque o som longe, à frente e de lado - ele não atrapalha o pensamento.</p>
<p><b>Som 3D: Desl.</b> - estéreo normal para comparar. <b>Trava</b> - para nada mudar no bolso. <b>Timer</b> - no fim o som diminui suavemente. <b>Sala</b> - sensação de distância; desligue para audiolivros.</p>
<p><b>As skins</b> mudam o player inteiro, não só as cores. Uma skin é um arquivo: salve, modifique, envie para um amigo.</p>
<p>Todo mundo ouve esquerda e direita. Algumas pessoas confundem “frente” e “trás” - é normal com fones.</p>`,
  tr: `<p><b>Kulaklık gerekli.</b> Kulaklık olmadan alan hissi olmaz.</p>
<p><b>Dosyalar / Klasör.</b> Birden çok bölüm ya da bütün bir klasör seçebilirsin - oynatıcı her birinde nerede kaldığını hatırlar.</p>
<p><b>Radar.</b> Ortadaki sensin. Papağan Wisp’i sürükle, ses oraya taşınır. Yakında daha yüksek ve net, uzakta daha kısık ve boğuk.</p>
<p><b>Yörünge.</b> Papağan seçilen şekil boyunca kendi kendine uçar. İyi bir kulak egzersizi: zamanla «önde» ve «arkada»yı ayırt etmek kolaylaşır. Çalışırken sesi uzağa, öne ve yana koy - düşünmeni engellemez.</p>
<p><b>3D ses: Kapalı</b> - karşılaştırmak için normal stereo. <b>Kilit</b> - cepte hiçbir şey kaymasın diye. <b>Uyku</b> - sonunda ses yavaşça kısılır. <b>Oda</b> - uzaklık hissi; sesli kitaplar için kapatabilirsin.</p>
<p><b>Temalar</b> oynatıcının tüm görünümünü değiştirir, sadece renkleri değil. Tema bir dosyadır: kaydet, değiştir, arkadaşına gönder.</p>
<p>Sol ve sağı herkes duyar. Bazıları «önde» ve «arkada»yı karıştırır - kulaklıkla bu normaldir.</p>`

function playStation(st) {

  S.tracks = []; S.cur = -1; S.ready = false; renderList();

      else if (n === 'style' && /url\s*\(|expression|@import/i.test(v)) el.removeAttribute(a.name);

// ======================================================================
//  Настройка слуха: «спереди - сзади».
//  Встроенный в браузер расчёт 3D-звука один на всех, а у людей разная форма ушей и головы,
//  поэтому «сзади» у многих звучит как «спереди». Подстраиваем то, что можем: контраст сзади.
// ======================================================================
const EARUI = (() => {
  const q = id => document.getElementById(id);
  let demoTimer = null, phase = 0, nbuf = null, quiz = null;
  const noise = () => {
    if (!nbuf) { nbuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    return nbuf;
  };
  // короткий шумовой щелчок: по такому звуку направление слышно лучше всего
  function burst(back) {
    initAudio(); ac.resume();
    const D = 1.2, now = ac.currentTime + 0.02, k = Math.min(1, Math.max(0, (D - 0.7) / (METERS - 0.7)));
    const src = new AudioBufferSourceNode(ac, { buffer: noise() });
    const lp = new BiquadFilterNode(ac, { type: 'lowpass', frequency: Math.max(2500, 20000 * Math.pow(5000 / 20000, k) * earMul(back ? 1 : 0)) });
    const pan = new PannerNode(ac, { panningModel: 'HRTF', distanceModel: 'inverse', refDistance: 1, rolloffFactor: 1, positionX: 0, positionY: 0, positionZ: earZ(back ? D : -D, D) });
    const g = new GainNode(ac, { gain: 0 });
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.5, now + 0.01); g.gain.setValueAtTime(0.5, now + 0.28); g.gain.linearRampToValueAtTime(0, now + 0.34);
    src.connect(lp).connect(pan).connect(g).connect(ac.destination);
    src.start(now); src.stop(now + 0.4);
  }
  function demoStart() {
    demoStop(); quizStop(); phase = 0;
    const tick = () => { const back = phase % 2 === 1; burst(back); q('earNow').textContent = t(back ? 'earBack' : 'earFront'); phase++; };
    tick(); demoTimer = setInterval(tick, 1100);
    q('earPlay').textContent = t('earStop'); q('earPlay').classList.add('on');
  }
  function demoStop() {
    clearInterval(demoTimer); demoTimer = null;
    if (q('earNow')) q('earNow').textContent = '';
    if (q('earPlay')) { q('earPlay').textContent = t('earPlay'); q('earPlay').classList.remove('on'); }
  }
  // слепая проверка: 10 сигналов в случайном порядке, нужно сказать, откуда звук
  function quizStart() {
    demoStop(); quiz = { n: 0, ok: 0, cur: null };
    q('earQuizBox').classList.remove('hidden'); q('earQuiz').classList.add('hidden'); q('earRes').textContent = ''; next();
  }
  function quizStop() { quiz = null; if (q('earQuizBox')) { q('earQuizBox').classList.add('hidden'); q('earQuiz').classList.remove('hidden'); q('earQprog').textContent = ''; } }
  function next() {
    if (!quiz) return;
    if (quiz.n >= 10) { finish(); return; }
    quiz.cur = Math.random() < 0.5; quiz.n++; q('earQprog').textContent = quiz.n + ' / 10'; q('earRes').textContent = '';
    setTimeout(() => { if (quiz && quiz.cur !== null) burst(quiz.cur); }, 350);
  }
  function answer(back) {
    if (!quiz || quiz.cur === null) return;
    const ok = back === quiz.cur; if (ok) quiz.ok++;
    q('earRes').textContent = ok ? '✓' : '✗ ' + t(quiz.cur ? 'earWasBack' : 'earWasFront');
    quiz.cur = null; setTimeout(next, 900);
  }
  function finish() {
    const ok = quiz.ok; quizStop();
    q('earRes').textContent = t('earScore').replace('{n}', ok) + ' ' + t(ok >= 8 ? 'earGood' : 'earMore');
  }
  function pct() { const sl = q('earSlider'); sl.style.setProperty('--p', sl.value + '%'); q('earVal').textContent = sl.value + '%'; }
  function setStrength(v) {
    EAR.s = v / 100; store.set('pp_ear', EAR.s); q('earSlider').value = v; pct();
    Object.values(SRCS).forEach(src => { try { applySrc(src); } catch (e) {} });
  }
  function init() {
    q('earSlider').value = Math.round(EAR.s * 100); pct(); q('earPlay').textContent = t('earPlay');
    q('earSlider').addEventListener('input', () => setStrength(+q('earSlider').value));
    q('earPlay').addEventListener('click', () => demoTimer ? demoStop() : demoStart());
    q('earQuiz').addEventListener('click', quizStart);
    q('earAns0').addEventListener('click', () => answer(false));
    q('earAns1').addEventListener('click', () => answer(true));
    q('earAgain').addEventListener('click', () => { if (quiz && quiz.cur !== null) burst(quiz.cur); });
    q('earReset').addEventListener('click', () => setStrength(45));
    q('earFold').addEventListener('toggle', () => { if (!q('earFold').open) { demoStop(); quizStop(); } });
    q('menuClose').addEventListener('click', () => { demoStop(); quizStop(); });
  }
  return { init };
})();

// ======================================================================
//  Пример для первого посетителя: музыка собирается прямо в браузере (без файла с сервера)
//  и сразу летит по кругу вокруг головы. Свой файл, папка или радио пример выключают.
// ======================================================================
const DEMO = (() => {
  let file = null, busy = false;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  async function synth() {
    const sr = 22050, beat = 0.625, bars = 8, dur = bars * 4 * beat; // 96 ударов в минуту, 20 секунд, по кругу
    const oc = new OfflineAudioContext(1, Math.ceil(sr * dur), sr);
    const out = oc.createGain(); out.gain.value = 0.6; out.connect(oc.destination);
    const nb = oc.createBuffer(1, sr, sr), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
    const tone = (t, type, f, a, peak, d) => { const o = oc.createOscillator(), g = oc.createGain(); o.type = type; o.frequency.value = f; o.connect(g).connect(out); env(g, t, a, peak, d); o.start(t); o.stop(Math.min(dur, t + a + d + 0.05)); };
    const hat = t => { const s = oc.createBufferSource(), f = oc.createBiquadFilter(), g = oc.createGain(); s.buffer = nb; f.type = 'highpass'; f.frequency.value = 6000; s.connect(f).connect(g).connect(out); env(g, t, 0.002, 0.12, 0.05); s.start(t, Math.random() * 0.5, 0.1); };
    const PROG = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], PAT = [0, 1, 2, 1, 0, 2, 1, 2];
    for (let step = 0; step < bars * 8; step++) {
      const t = step * beat / 2, ch = PROG[Math.floor(step / 8) % 4], i = step % 8;
      tone(t, 'triangle', mtof(ch[PAT[i]] + 12), 0.005, 0.32, 0.42);
      if (i === 0) for (const n of ch) tone(t, 'sine', mtof(n), 0.4, 0.06, 2.0); // мягкий аккорд
      if (i === 0 || i === 4) tone(t, 'sine', mtof(ch[0] - 12), 0.01, 0.5, 0.9);
      if (i % 2 === 1) hat(t);
    }
    const buf = await oc.startRendering(), d = buf.getChannelData(0), n = d.length;
    let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(d[i]));
    const k = peak > 0 ? 0.8 / peak : 1, ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i] * k)) * 32767, true);
    return new File([ab], 'Wisp demo.wav', { type: 'audio/wav' });
  }
  async function play() {
    if (busy) return; busy = true;
    initAudio(); ac.resume();
    try { if (!file) file = await synth(); } catch (e) { busy = false; toast(t('noAudio')); return; }
    S.demo = true; S.tracks = [file]; S.cur = -1; load(0);
    // музыка - выбранный источник, и сразу по кругу (настройки орбиты пользователя не сохраняем)
    LAY.selectSource(SRCS.music);
    O.shape = 'circle'; O.size = 0.6; O.period = 12; O.dir = 1;
    if (!O.on) orbitStart(); else render();
    ping('demo'); busy = false;
  }
  return { play };
})();

  async function can3d(url) {
    const c = new AbortController(), tm = setTimeout(() => c.abort(), 5000);
    try { const r = await fetch(url, { mode: 'cors', cache: 'no-store', signal: c.signal }); c.abort(); return r.ok; }
    catch (e) { return e.name === 'AbortError' ? null : false; }
    finally { clearTimeout(tm); }
  }
  function row(st, status) {
    const r = document.createElement('div'); r.className = 'st';
    r.innerHTML = '<button class="sp"><b></b><small></small></button><span class="bd wait">…</span><button class="add">+</button>';
    r.querySelector('b').textContent = st.name;
    r.querySelector('small').textContent = [st.cc, st.codec, st.bitrate ? st.bitrate + 'k' : ''].filter(Boolean).join(' · ');
    r.querySelector('.sp').addEventListener('click', () => { playStation(st); renderStations(); q('scanList').querySelectorAll('.st').forEach(x => x.classList.toggle('on', x === r)); });
    const add = r.querySelector('.add');
    const saved = () => stations.some(x => x.url === st.url);
    if (saved()) { add.textContent = '✓'; add.disabled = true; }
    add.addEventListener('click', () => { if (!saved()) { stations.push({ name: st.name, url: st.url, d3: st.d3 }); store.set('pp_stations', stations); renderStations(); } add.textContent = '✓'; add.disabled = true; });
    st.el = r; return r;
  }
  function badge(st) {
    const b = st.el.querySelector('.bd');
    b.className = 'bd' + (st.d3 === true ? '' : ' no');
    b.textContent = st.d3 === true ? '3D' : st.d3 === false ? t('stereo') : '?';
  }
  async function scan(cc) {
    const my = ++runId, box = q('scanList'), state = q('scanState');
    box.innerHTML = ''; state.textContent = t('scanLoading');
    let list;
    try {
      list = await api('/json/stations/search?hidebroken=true&order=clickcount&reverse=true&limit=80' + (cc ? '&countrycode=' + cc : ''));
    } catch (e) { if (my === runId) state.textContent = t('scanFail'); return; }
    if (my !== runId) return;
    // только https: страница открыта по https, и обычный http-поток браузер не пустит
    const seen = new Set(), sts = [];
    for (const s of list) {
      const url = (s.url_resolved || s.url || '').trim();
      if (!/^https:\/\//i.test(url) || seen.has(url)) continue;
      seen.add(url); sts.push({ name: (s.name || url).trim().slice(0, 60), url, cc: s.countrycode, codec: s.codec, bitrate: s.bitrate });
      if (sts.length >= 30) break;
    }
    if (!sts.length) { state.textContent = t('scanNone'); return; }
    sts.forEach(st => box.appendChild(row(st)));
    let done = 0, i = 0;
    const tick = () => { state.textContent = t('scanChecking').replace('{n}', done).replace('{m}', sts.length); };
    tick();
    const worker = async () => { while (i < sts.length && my === runId) { const st = sts[i++]; st.d3 = await can3d(st.url); if (my !== runId) return; badge(st); done++; tick(); } };
    await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
    if (my !== runId) return;
    // 3D - наверх
    sts.slice().sort((a, b) => (b.d3 === true) - (a.d3 === true)).forEach(st => box.appendChild(st.el));
    state.textContent = t('scanDone').replace('{n}', sts.length).replace('{k}', sts.filter(s => s.d3 === true).length);
  }
  async function fillCountries() {
    if (countries) return;
    try { countries = await api('/json/countries?order=stationcount&reverse=true&hidebroken=true'); } catch (e) { countries = []; }
    const sel = q('scanCountry');
    const opts = countries.filter(c => c.iso_3166_1 && c.stationcount >= 20).slice(0, 90)
      .map(c => ({ cc: c.iso_3166_1.toUpperCase(), n: cname(c.iso_3166_1.toUpperCase()) })).sort((a, b) => a.n.localeCompare(b.n, lang));
    sel.innerHTML = '<option value="">' + t('scanOther') + '</option>' + opts.map(o => '<option value="' + o.cc + '">' + o.n.replace(/</g, '&lt;') + '</option>').join('');
    sel.classList.remove('hidden');
  }
  function paint() { const b = q('scanHere'); if (b) b.textContent = '📡 ' + t('scanIn') + ' ' + cname(here); }
  function init() {
    here = detect(); paint();
    q('scanHere').addEventListener('click', () => { ping('scan'); scan(here); fillCountries(); });
    q('scanWorld').addEventListener('click', () => { ping('scan'); scan(''); fillCountries(); });
    q('scanCountry').addEventListener('change', e => { if (e.target.value) scan(e.target.value); });
  }
  return { init, paint };
})();

// ---------------- Купол и ширина стерео ----------------
(() => {
  const dSl = $('domeSl'), wSl = $('widthSl');
  const show = () => {
    dSl.value = Math.round(S.dome * 100); dSl.style.setProperty('--p', ((S.dome * 100 - 40) / 120 * 100) + '%'); $('domeVal').textContent = Math.round(S.dome * 100) + '%';
    wSl.value = S.width; wSl.style.setProperty('--p', (S.width / 120 * 100) + '%'); $('widthVal').textContent = S.width + '°';
  };
  dSl.addEventListener('input', () => { S.dome = +dSl.value / 100; store.set('pp_dome', S.dome); show(); reapplyAll(); });
  wSl.addEventListener('input', () => { S.width = +wSl.value; store.set('pp_width', S.width); show(); if (ac) applyPos(false); });
  show();
})();

makeMenuWidgets();

AI.init();
LAY.init();
useSkin(skinId);
CALL.init();
